name: Monitor de passagens

on:
  schedule:
    # Quatro execuções por dia (UTC); o horário pode atrasar alguns minutos.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-passagens
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto e o histórico
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Consultar preços e enviar alertas
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --once

      - name: Gerar painel web
        if: always()
        run: python dashboard.py

      - name: Salvar histórico no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fares.sqlite3 docs/index.html
          if git diff --cached --quiet; then
            echo "Histórico sem alterações para salvar."
          else
            git commit -m "Atualiza histórico de tarifas"
            git push
          fi
